<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipForge — Local AI Shorts</title>
<style>
  :root {
    --bg: #0b0d13;
    --card: #141823;
    --card-2: #1c2130;
    --line: #2a3142;
    --line-2: #353d52;
    --text: #eef1f7;
    --muted: #8b93a7;
    --muted-2: #6b7388;
    --accent: #6c5ce7;
    --accent-2: #8f7bff;
    --ok: #28c76f;
    --warn: #ffb020;
    --danger: #ff5e6c;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1100px 560px at 50% -12%, #1d2236 0%, rgba(13,16,23,0) 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 44px 16px 96px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 820px; }

  /* ---- Hero ---- */
  .hero { text-align: center; margin-bottom: 30px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px; margin-bottom: 14px;
    font-weight: 800; letter-spacing: .3px;
  }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 8px 24px rgba(108,92,231,.45);
  }
  .hero h1 {
    font-size: clamp(30px, 5vw, 40px); margin: 0 0 10px; line-height: 1.05;
    background: linear-gradient(90deg, #fff, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); margin: 0 auto; font-size: 15px; max-width: 520px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 14px;
    padding: 5px 13px; font-size: 12px; color: var(--ok);
    border: 1px solid #1f3a2b; border-radius: 999px; background: #0f2419;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  /* ---- Card ---- */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius); padding: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  .fieldlabel { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted);
    margin: 20px 0 9px; text-transform: uppercase; letter-spacing: .6px; }
  .fieldlabel:first-child { margin-top: 0; }

  .input-wrap { position: relative; }
  .input-wrap .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  input[type=text], input.barinput {
    width: 100%; padding: 15px 16px; font-size: 15.5px;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap input { padding-left: 44px; }
  input[type=text]:focus, input.barinput:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,.18);
  }

  .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 18px; }
  .control { flex: 1; min-width: 190px; }
  .toggle { display: flex; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; padding: 4px; gap: 4px; }
  .toggle button {
    flex: 1; padding: 11px 8px; background: transparent; color: var(--muted);
    border: 0; cursor: pointer; font-size: 13.5px; font-weight: 600; border-radius: 9px; transition: .15s;
  }
  .toggle button:hover { color: var(--text); }
  .toggle button.active { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(108,92,231,.4); }

  .counter { display: flex; align-items: center; gap: 10px; }
  .counter button {
    width: 46px; height: 46px; font-size: 22px; border-radius: 11px; line-height: 1;
    background: var(--card-2); color: var(--text); border: 1px solid var(--line); cursor: pointer; transition: .12s;
  }
  .counter button:hover { border-color: var(--accent); color: var(--accent-2); }
  .counter input {
    width: 100%; text-align: center; padding: 12px; font-size: 16px;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 11px; color: var(--text); outline: none;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    padding: 9px 15px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: var(--card-2); border: 1px solid var(--line); color: var(--muted); transition: .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--line-2); }
  .chip.active { border-color: var(--accent); color: #fff; background: #241f3f; }

  .preview {
    margin-top: 14px; height: 150px; border-radius: 12px; border: 1px solid var(--line);
    background:
      linear-gradient(135deg, #2b3550, #141826),
      repeating-linear-gradient(45deg, #0000 0 12px, #ffffff08 12px 24px);
    display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
  }
  .preview .capline { margin-bottom: 18px; padding: 0 12px; text-align: center; line-height: 1.15; font-weight: 800; white-space: nowrap; }

  .hidden { display: none !important; }

  .generate {
    width: 100%; margin-top: 26px; padding: 16px; font-size: 16.5px; font-weight: 700;
    color: #fff; border: 0; border-radius: 13px; cursor: pointer; letter-spacing: .2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 12px 30px rgba(108,92,231,.4); transition: transform .1s, opacity .15s;
  }
  .generate:hover:not(:disabled) { transform: translateY(-1px); }
  .generate:disabled { opacity: .65; cursor: progress; box-shadow: none; }

  .error {
    margin-top: 18px; padding: 14px 16px; border-radius: 12px;
    background: #2a151a; border: 1px solid #5a2730; color: var(--danger); font-size: 14px;
    white-space: pre-wrap; display: flex; gap: 10px; align-items: flex-start;
  }

  /* ---- Progress panel ---- */
  .progress-panel {
    margin-top: 22px; padding: 22px; border-radius: var(--radius);
    background: var(--card-2); border: 1px solid var(--line);
  }
  .steps { display: flex; gap: 8px; margin-bottom: 20px; }
  .step { flex: 1; text-align: center; position: relative; }
  .step .ring {
    width: 38px; height: 38px; margin: 0 auto 8px; border-radius: 50%;
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    background: var(--card); border: 2px solid var(--line); color: var(--muted); transition: .25s;
  }
  .step .label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .3px; transition: .25s; }
  .step::before {
    content: ""; position: absolute; top: 19px; left: -50%; width: 100%; height: 2px;
    background: var(--line); z-index: 0;
  }
  .step:first-child::before { display: none; }
  .step .ring { position: relative; z-index: 1; }
  .step.active .ring { border-color: var(--accent); color: #fff; background: #241f3f; box-shadow: 0 0 0 4px rgba(108,92,231,.18); }
  .step.active .label { color: var(--text); }
  .step.done .ring { border-color: var(--ok); color: #fff; background: var(--ok); }
  .step.done .label { color: var(--text); }
  .step.done::before { background: var(--ok); }

  .bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .bar-msg { font-size: 14px; color: var(--text); font-weight: 500; display: flex; align-items: center; gap: 9px; }
  .bar-pct { font-size: 14px; color: var(--accent-2); font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar-track { height: 10px; border-radius: 999px; background: #0e1119; overflow: hidden; border: 1px solid var(--line); }
  .bar-fill {
    height: 100%; width: 0%; border-radius: 999px; transition: width .35s ease;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    background-size: 200% 100%;
  }
  .bar-fill.indeterminate { animation: shimmer 1.1s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .bar-fill.error { background: var(--danger); }
  .bar-fill.done { background: var(--ok); }

  .spinner {
    display: inline-block; width: 15px; height: 15px; border: 2px solid #ffffff44; border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Results ---- */
  .results-head { margin: 34px 0 4px; display: flex; align-items: baseline; justify-content: space-between; }
  .results-head h2 { font-size: 19px; margin: 0; }
  .results-head span { color: var(--muted); font-size: 13px; }
  .results { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .clip {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    animation: pop .3s ease; transition: transform .12s, border-color .15s;
  }
  .clip:hover { transform: translateY(-3px); border-color: var(--line-2); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .clip video { width: 100%; display: block; background: #000; aspect-ratio: 9/16; object-fit: contain; }
  .clip .meta { padding: 12px 14px; }
  .clip .meta h3 { margin: 0 0 4px; font-size: 14px; line-height: 1.25; }
  .clip .meta .sub { color: var(--muted); font-size: 12px; }
  .clip .meta .actions { margin-top: 10px; display: flex; gap: 8px; }
  .clip .meta a, .clip .meta button.copy {
    flex: 1; text-align: center; padding: 8px; font-size: 12.5px; font-weight: 600;
    border-radius: 9px; text-decoration: none; cursor: pointer; transition: .12s; border: 1px solid var(--line);
  }
  .clip .meta a { color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border: 0; }
  .clip .meta button.copy { color: var(--muted); background: var(--card-2); }
  .clip .meta button.copy:hover { color: var(--text); border-color: var(--line-2); }

  .skeleton { border: 1px dashed var(--line); border-radius: 14px; height: 320px; display: grid; place-items: center;
    color: var(--muted); font-size: 13px; gap: 10px; background: var(--card-2); }
  .skeleton .spinner { width: 22px; height: 22px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo"><span class="mark">✂️</span><span>ClipForge</span></div>
    <h1>Turn any video into viral shorts</h1>
    <p>Download, transcribe, and auto-caption clips — 100% on your own machine. No API keys, no cloud AI.</p>
    <span class="badge"><span class="dot"></span> Runs locally · Whisper on <b id="deviceTag">…</b></span>
  </div>

  <div class="card">
    <label class="fieldlabel">Video URL</label>
    <div class="input-wrap">
      <span class="ic">🔗</span>
      <input id="url" type="text" placeholder="Paste a YouTube (or other) video URL…" />
    </div>

    <div class="controls">
      <div class="control">
        <label class="fieldlabel">Aspect ratio</label>
        <div class="toggle" id="aspect">
          <button data-val="9:16" class="active">9:16 ↕</button>
          <button data-val="16:9">16:9 ↔</button>
        </div>
      </div>
      <div class="control">
        <label class="fieldlabel">Fit mode</label>
        <div class="toggle" id="fit">
          <button data-val="crop" class="active">Crop (fill)</button>
          <button data-val="pad">Pad (bars)</button>
        </div>
      </div>
      <div class="control">
        <label class="fieldlabel">Clips</label>
        <div class="counter">
          <button id="minus" type="button">−</button>
          <input id="numClips" type="number" min="1" max="10" value="3" />
          <button id="plus" type="button">+</button>
        </div>
      </div>
    </div>

    <div id="barWrap" class="hidden">
      <label class="fieldlabel">Top bar text</label>
      <input id="barText" class="barinput" type="text" placeholder="Text shown on the top bar…" />
    </div>

    <label class="fieldlabel">Caption style</label>
    <div class="chips" id="styleChips"></div>
    <div class="preview"><div class="capline" id="capPreview">YOUR CAPTION STYLE</div></div>

    <button class="generate" id="generateBtn">⚡ Generate Shorts</button>
    <div id="error" class="error hidden"></div>

    <!-- Progress panel -->
    <div id="progressPanel" class="progress-panel hidden">
      <div class="steps" id="steps"></div>
      <div class="bar-row">
        <div class="bar-msg"><span class="spinner" id="barSpinner"></span><span id="barMsg">Starting…</span></div>
        <div class="bar-pct" id="barPct">0%</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>

  <div id="resultsHead" class="results-head hidden">
    <h2>Your clips</h2>
    <span id="resultsCount"></span>
  </div>
  <div class="results" id="results"></div>

  <footer>ClipForge · local pipeline: yt-dlp → faster-whisper → ffmpeg</footer>
</div>

<script>
const STAGES = [
  { key: "downloading", label: "Download" },
  { key: "transcribing", label: "Transcribe" },
  { key: "selecting", label: "Analyze" },
  { key: "rendering", label: "Render" },
];

const state = {
  aspect: "9:16",
  fit: "crop",
  numClips: 3,
  caption_style: null,
  presets: [],
  evtSource: null,
  renderedCount: 0,
};

// ---- Toggles ----
function bindToggle(id, key, onChange) {
  const root = document.getElementById(id);
  root.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      root.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset.val;
      if (onChange) onChange(btn.dataset.val);
    });
  });
}
bindToggle("aspect", "aspect");
bindToggle("fit", "fit", val => {
  document.getElementById("barWrap").classList.toggle("hidden", val !== "pad");
});

// ---- Clip counter ----
const numInput = document.getElementById("numClips");
function clampClips() {
  let n = parseInt(numInput.value || "1", 10);
  if (isNaN(n)) n = 1;
  n = Math.max(1, Math.min(10, n));
  numInput.value = n; state.numClips = n;
}
document.getElementById("minus").onclick = () => { numInput.value = (state.numClips - 1); clampClips(); };
document.getElementById("plus").onclick = () => { numInput.value = (state.numClips + 1); clampClips(); };
numInput.addEventListener("input", clampClips);

// ---- Caption style preview ----
const SAMPLE = ["This", "is", "your", "caption"];
function renderPreview() {
  const p = state.presets.find(x => x.id === state.caption_style);
  if (!p) return;
  const el = document.getElementById("capPreview");
  const px = Math.max(18, Math.round(p.font_size * 0.30));
  const txt = p.uppercase ? SAMPLE.map(w => w.toUpperCase()) : SAMPLE;
  const o = Math.max(1, Math.round(p.outline * 0.6));
  const oc = p.outline_color;
  const stroke = [
    `-${o}px -${o}px 0 ${oc}`, `${o}px -${o}px 0 ${oc}`,
    `-${o}px ${o}px 0 ${oc}`, `${o}px ${o}px 0 ${oc}`,
    `0 2px 4px rgba(0,0,0,.6)`
  ].join(",");
  el.style.fontFamily = "'" + p.font_family + "', 'Arial Black', sans-serif";
  el.style.fontSize = px + "px";
  el.style.fontWeight = p.bold ? "800" : "600";
  el.style.textShadow = stroke;
  el.innerHTML = txt.map((w, i) => {
    const color = (p.karaoke && i === 2) ? p.highlight_color : p.primary_color;
    return `<span style="color:${color}">${w}</span>`;
  }).join(" ");
}

function renderChips() {
  const root = document.getElementById("styleChips");
  root.innerHTML = "";
  state.presets.forEach(p => {
    const chip = document.createElement("div");
    chip.className = "chip" + (p.id === state.caption_style ? " active" : "");
    chip.textContent = p.label;
    chip.onclick = () => { state.caption_style = p.id; renderChips(); renderPreview(); };
    root.appendChild(chip);
  });
}

async function loadStyles() {
  try {
    const res = await fetch("/api/caption-styles");
    state.presets = await res.json();
    if (state.presets.length) {
      state.caption_style = state.presets[0].id;
      renderChips();
      renderPreview();
    }
  } catch (e) { showError("Could not load caption styles: " + e.message); }
}

async function loadDevice() {
  try {
    const res = await fetch("/health");
    const d = await res.json();
    document.getElementById("deviceTag").textContent = (d.device || "cpu").toUpperCase();
  } catch (e) { document.getElementById("deviceTag").textContent = "—"; }
}

// ---- Errors ----
function showError(msg) {
  const el = document.getElementById("error");
  el.innerHTML = `<span>⚠️</span><span>${escapeHtml(msg)}</span>`;
  el.classList.remove("hidden");
}
function clearError() { document.getElementById("error").classList.add("hidden"); }

// ---- Progress UI ----
function buildSteps() {
  const root = document.getElementById("steps");
  root.innerHTML = "";
  STAGES.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "step";
    div.dataset.key = s.key;
    div.innerHTML = `<div class="ring">${i + 1}</div><div class="label">${s.label}</div>`;
    root.appendChild(div);
  });
}

function updateSteps(stage, status) {
  let curIdx = STAGES.findIndex(s => s.key === stage);
  if (status === "done") curIdx = STAGES.length;
  document.querySelectorAll(".step").forEach((el, i) => {
    el.classList.toggle("done", i < curIdx);
    el.classList.toggle("active", i === curIdx && status !== "done");
    const ring = el.querySelector(".ring");
    ring.textContent = i < curIdx ? "✓" : (i + 1);
  });
}

function setBar(pct, msg, mode) {
  const fill = document.getElementById("barFill");
  fill.style.width = Math.round(pct) + "%";
  fill.className = "bar-fill" + (mode ? " " + mode : "");
  document.getElementById("barPct").textContent = Math.round(pct) + "%";
  document.getElementById("barMsg").textContent = msg;
  const sp = document.getElementById("barSpinner");
  sp.style.display = (mode === "done" || mode === "error") ? "none" : "inline-block";
  document.getElementById("barPct").style.color =
    mode === "error" ? "var(--danger)" : (mode === "done" ? "var(--ok)" : "var(--accent-2)");
}

// ---- Results ----
function showResultsHead() { document.getElementById("resultsHead").classList.remove("hidden"); }

function renderClip(c) {
  const root = document.getElementById("results");
  const dur = (c.end - c.start).toFixed(1);
  const card = document.createElement("div");
  card.className = "clip";
  card.innerHTML = `
    <video src="${c.url}" controls preload="metadata"></video>
    <div class="meta">
      <h3>${escapeHtml(c.title)}</h3>
      <div class="sub">${dur}s · ${c.start.toFixed(1)}–${c.end.toFixed(1)}s</div>
      <div class="actions">
        <a href="${c.url}" download>⤓ Download</a>
        <button class="copy" data-url="${c.url}">Copy link</button>
      </div>
    </div>`;
  card.querySelector(".copy").onclick = (e) => {
    const full = location.origin + e.target.dataset.url;
    navigator.clipboard.writeText(full).then(() => {
      e.target.textContent = "Copied!";
      setTimeout(() => { e.target.textContent = "Copy link"; }, 1400);
    });
  };
  root.appendChild(card);
}

function updateResultsCount(n) {
  document.getElementById("resultsCount").textContent = n + (n === 1 ? " clip" : " clips");
}

// ---- Generate flow (SSE) ----
const btn = document.getElementById("generateBtn");
function setBusy(busy) {
  btn.disabled = busy;
  btn.innerHTML = busy ? '<span class="spinner"></span> Working…' : "⚡ Generate Shorts";
}

function handleSnapshot(snap) {
  if (snap.status === "error") {
    setBar(snap.progress * 100, snap.message || "Failed.", "error");
    showError(snap.error || snap.message || "The pipeline failed.");
    setBusy(false);
    closeStream();
    return;
  }

  const mode = snap.status === "done" ? "done" : "";
  setBar(snap.progress * 100, snap.message || "Working…", mode);
  updateSteps(snap.stage, snap.status);

  // Stream finished clips in as they appear.
  if (snap.clips && snap.clips.length > state.renderedCount) {
    showResultsHead();
    for (let i = state.renderedCount; i < snap.clips.length; i++) renderClip(snap.clips[i]);
    state.renderedCount = snap.clips.length;
    updateResultsCount(state.renderedCount);
  }

  if (snap.status === "done") {
    setBusy(false);
    closeStream();
    if (!snap.clips || !snap.clips.length) showError("No clips were produced.");
  }
}

function closeStream() {
  if (state.evtSource) { state.evtSource.close(); state.evtSource = null; }
}

btn.addEventListener("click", async () => {
  clearError();
  const url = document.getElementById("url").value.trim();
  if (!url) { showError("Please paste a video URL first."); return; }

  const payload = {
    video_url: url,
    aspect_ratio: state.aspect,
    fit_mode: state.fit,
    bar_text: state.fit === "pad" ? (document.getElementById("barText").value.trim() || null) : null,
    num_clips: state.numClips,
    caption_style: state.caption_style,
  };

  // Reset UI.
  setBusy(true);
  closeStream();
  state.renderedCount = 0;
  document.getElementById("results").innerHTML = "";
  document.getElementById("resultsHead").classList.add("hidden");
  document.getElementById("progressPanel").classList.remove("hidden");
  buildSteps();
  setBar(2, "Queued — starting pipeline…", "indeterminate");

  let jobId;
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ("Request failed (" + res.status + ")"));
    jobId = data.job_id;
  } catch (e) {
    setBar(0, "Failed to start.", "error");
    showError("Could not start the job: " + e.message);
    setBusy(false);
    return;
  }

  // Subscribe to live progress.
  const es = new EventSource(`/api/progress/${jobId}`);
  state.evtSource = es;
  es.onmessage = (ev) => {
    try { handleSnapshot(JSON.parse(ev.data)); } catch (e) {}
  };
  es.onerror = async () => {
    // Stream dropped — fall back to a one-shot result fetch before giving up.
    closeStream();
    try {
      const res = await fetch(`/api/result/${jobId}`);
      if (res.ok) { handleSnapshot(await res.json()); return; }
    } catch (e) {}
    if (btn.disabled) {
      showError("Lost connection to the progress stream. The clips may still finish — refresh /api/result.");
      setBusy(false);
    }
  };
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

loadStyles();
loadDevice();
</script>
</body>
</html>
